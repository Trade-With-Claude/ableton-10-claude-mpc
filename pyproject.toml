[project]
name = "claude-mpc"
version = "0.1.0"
description = "MCP bridge between Claude Code and Ableton Live 10"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["mcp>=2.3,<3", "spectrum-advisor"]

[tool.uv.sources]
spectrum-advisor = { git = "https://github.com/Trade-With-Claude/spectrum-advisor", rev = "2b45287e20a80df34711c470e8b31cf6728ae712" }

[project.scripts]
claude-mpc = "claude_mpc.server:main"

[dependency-groups]
dev = ["pytest>=8", "vermin>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_mpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
