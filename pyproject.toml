[project]
name = "claude-mpc"
version = "0.1.0"
description = "MCP bridge between Claude Code and Ableton Live 10"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
claude-mpc = "claude_mpc.server:main"

[dependency-groups]
dev = ["pytest>=8", "vermin>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_mpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
